name: ci

on:
  push:
    # Every branch, but no tag: a tag runs the same check in release.yml.
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS runs the servers under a guard rather than with Pdeathsig, and
    # its temporary directory lies behind a link: both need their own run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - run: task check
